name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sinequanonn/uhsuh-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers(MySQL, Redis)는 러너의 Docker 데몬에서 뜬다. 테스트 통과해야 배포한다.
      - name: Build & Test
        working-directory: backend
        run: ./gradlew build --no-daemon

      # 배포되는 관측 설정을 미리 검증한다. 깨진 설정이 프로덕션에 도달하지 않게 막는다.
      - name: Validate monitoring configs
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/backend/monitoring/prometheus:/w:ro" prom/prometheus:latest \
            check config /w/prometheus.cloud.yml

          for cfg in config.app.alloy config.data.alloy; do
            docker run --rm -v "$PWD/backend/deploy/alloy:/etc/alloy:ro" \
              -e INSTANCE_NAME=ci \
              -e GRAFANA_CLOUD_LOKI_URL=https://example.invalid/loki/api/v1/push \
              -e GRAFANA_CLOUD_LOKI_USER=0 \
              -e GRAFANA_CLOUD_PROM_URL=https://example.invalid/api/prom/push \
              -e GRAFANA_CLOUD_PROM_USER=0 \
              -e GRAFANA_CLOUD_TOKEN=ci \
              grafana/alloy:v1.10.0 validate "/etc/alloy/$cfg"
          done

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/deploy/docker-compose.data.yml,backend/deploy/alloy/config.data.alloy
          target: /opt/uhsuh/
          strip_components: 2

      # monitoring/ 은 경로 깊이가 달라 strip_components 를 1로 둔 별도 단계로 보낸다.
      # .env 와 prometheus/gc_token 은 레포에 없으므로 박스의 기존 파일이 유지된다.
      - name: Copy monitoring config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/monitoring/docker-compose.grafana-cloud.yml,backend/monitoring/prometheus/prometheus.cloud.yml
          target: /opt/uhsuh/
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/uhsuh

            cat > .env <<EOF
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            GRAFANA_CLOUD_LOKI_URL=${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
            GRAFANA_CLOUD_LOKI_USER=${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
            GRAFANA_CLOUD_PROM_URL=${{ secrets.GRAFANA_CLOUD_PROM_URL }}
            GRAFANA_CLOUD_PROM_USER=${{ secrets.GRAFANA_CLOUD_PROM_USER }}
            GRAFANA_CLOUD_TOKEN=${{ secrets.GRAFANA_CLOUD_TOKEN }}
            EOF
            chmod 600 .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.data.yml pull
            docker compose -f docker-compose.data.yml up -d

            cd /opt/uhsuh/monitoring
            docker compose -f docker-compose.grafana-cloud.yml up -d
            # 설정 파일은 바인드 마운트라 컨테이너 재생성으로는 반영되지 않는다. SIGHUP 으로 리로드한다.
            # 설정이 잘못되면 Prometheus 는 기존 설정을 유지하고 에러만 남긴다(죽지 않는다).
            docker kill -s HUP uhsuh-prom-agent || true

            docker image prune -f

  deploy-app:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - host_secret: APP1_HOST
            instance_name: app1
          - host_secret: APP2_HOST
            instance_name: app2
    steps:
      - uses: actions/checkout@v4

      - name: Copy app compose to app box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/deploy/docker-compose.app.yml,backend/deploy/alloy/config.app.alloy
          target: /opt/uhsuh/
          strip_components: 2

      - name: Deploy app on app box
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/uhsuh

            cat > .env <<EOF
            DATA_HOST=${{ secrets.DATA_HOST }}
            INSTANCE_NAME=${{ matrix.instance_name }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            GRAFANA_CLOUD_LOKI_URL=${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
            GRAFANA_CLOUD_LOKI_USER=${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
            GRAFANA_CLOUD_PROM_URL=${{ secrets.GRAFANA_CLOUD_PROM_URL }}
            GRAFANA_CLOUD_PROM_USER=${{ secrets.GRAFANA_CLOUD_PROM_USER }}
            GRAFANA_CLOUD_TOKEN=${{ secrets.GRAFANA_CLOUD_TOKEN }}
            EOF
            chmod 600 .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.app.yml pull
            docker compose -f docker-compose.app.yml up -d
            docker image prune -f
