<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    줍줍한 글 <span th:text="${digestCount}">3</span>개를 확인해 보세요.
</div>
<div style="max-width:640px;margin:0 auto;padding:32px 18px;font-family:'Apple SD Gothic Neo',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:#15201a;">
    <div style="border:1px solid #e4e9e5;border-radius:18px;overflow:hidden;background:#ffffff;">
        <div style="padding:26px 26px 22px;border-bottom:1px solid #e4e9e5;">
            <p style="font-size:23px;font-weight:800;letter-spacing:-0.02em;line-height:1.3;margin:12px 0 0;color:#15201a;">
                줍줍한 글 <span style="color:#1f6f4a;" th:text="${digestCount}">3</span>개
            </p>
        </div>

        <div style="padding:24px 26px;">
            <p style="font-size:14px;line-height:1.65;color:#5c6b62;margin:0 0 20px;">
                🌰 구독하신 키워드에 맞는 새 글을 주워왔어요.
            </p>

            <div th:each="a : ${articles}"
                 style="border:1px solid #e4e9e5;border-radius:14px;padding:18px 18px 15px;margin-bottom:12px;">
                <div style="font-size:12px;color:#5c6b62;margin-bottom:9px;">
                    <span style="font-weight:700;color:#15201a;" th:text="${a.blogName()}">블로그</span>
                    · <span th:text="${a.dateText()}">2026.06.15</span>
                </div>
                <a th:href="${a.url()}" target="_blank" rel="noopener"
                   style="display:block;font-size:17px;font-weight:700;line-height:1.45;color:#15201a;text-decoration:none;margin-bottom:12px;"
                   th:text="${a.title()}">글 제목</a>
                <div style="margin-bottom:14px;">
                    <span th:each="kw : ${a.keywords()}"
                          style="display:inline-block;font-size:12px;font-weight:600;color:#1f6f4a;background:#e8f1ec;padding:4px 10px;border-radius:8px;margin:0 6px 6px 0;"
                          th:text="${kw}">키워드</span>
                </div>
                <div style="text-align:right;">
                    <a th:href="${a.url()}" target="_blank" rel="noopener"
                       style="display:inline-block;font-size:13px;font-weight:700;color:#ffffff;background:#1f6f4a;padding:10px 18px;border-radius:10px;text-decoration:none;">원문 보기</a>
                </div>
            </div>
        </div>

        <div style="padding:22px 26px;border-top:1px solid #e4e9e5;">
            <p style="font-size:12px;line-height:1.65;color:#5c6b62;margin:0;">
                글의 저작권은 원저작자에게 있으며 원문으로 연결됩니다. 더 이상 받고 싶지 않다면
                <a th:href="${unsubscribeUrl}" style="color:#1f6f4a;font-weight:700;text-decoration:underline;">구독 해지</a> 하세요.
            </p>
        </div>
    </div>

    <div style="text-align:center;padding:18px 0 4px;">
        <p style="font-size:11px;color:#9aa8a0;margin:0;">어서줍줍 · 기술 블로그 키워드 구독</p>
    </div>
</div>
</body>
</html>
