spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/uhsuhjupjup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: uhsuhjupjup
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  instance-name: ${INSTANCE_NAME:local}

firebase:
  service-account-path: ${UHSUHJUPJUP_FIREBASE_CREDENTIALS_PATH}

claude:
  enabled: ${CLAUDE_ENABLED:false}
  model: ${CLAUDE_MODEL:claude-haiku-4-5}
  timeout:
    connect: ${CLAUDE_TIMEOUT_CONNECT:PT5S}   # 연결 수립 상한
    call: ${CLAUDE_TIMEOUT_CALL:PT10S}        # 요청 1건 전체(읽기 포함) 상한, 노트추천 요청 스레드가 오래 붙잡히지 않게

gpt:
  enabled: ${GPT_ENABLED:false}               # Claude 실패/서킷 OPEN 시 폴백, 키 없으면 false 유지
  model: ${GPT_MODEL:gpt-4o-mini}             # OpenAI 모델, 더 최신 mini급으로 환경변수(GPT_MODEL)로 교체
  timeout:
    connect: ${GPT_TIMEOUT_CONNECT:PT5S}      # 연결 수립 상한
    call: ${GPT_TIMEOUT_CALL:PT10S}           # 요청 1건 전체(읽기 포함) 상한

resilience4j:
  circuitbreaker:
    instances:
      keywordClassifier:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20                                  # 최근 20건으로 실패율 판정
        minimum-number-of-calls: 10                              # 표본 10건 미만이면 판정 보류, 초기 오탐 방지
        failure-rate-threshold: 50                               # 실패율 50% 이상이면 OPEN
        wait-duration-in-open-state: 30s                         # OPEN 후 30초간 Claude 건너뛰고 GPT 폴백, 죽은 API 반복 호출 차단
        permitted-number-of-calls-in-half-open-state: 3          # HALF_OPEN 복귀 시 3건으로 회복 확인
        automatic-transition-from-open-to-half-open-enabled: true
      keywordClassifierGpt:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20                                  # GPT 폴백 경로의 실패율 판정
        minimum-number-of-calls: 10                              # 표본 10건 미만이면 판정 보류
        failure-rate-threshold: 50                               # 실패율 50% 이상이면 OPEN
        wait-duration-in-open-state: 30s                         # OPEN 후 30초간 GPT 건너뛰기, Claude, GPT 모두 OPEN이면 분류 예외
        permitted-number-of-calls-in-half-open-state: 3          # HALF_OPEN 복귀 시 3건으로 회복 확인
        automatic-transition-from-open-to-half-open-enabled: true

notification:
  max-per-member: ${NOTIFICATION_MAX_PER_MEMBER:5}

outbox:
  poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:60000}
  poll-initial-delay-ms: ${OUTBOX_POLL_INITIAL_DELAY_MS:60000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:15}
  retry-backoff-base: ${OUTBOX_RETRY_BACKOFF_BASE:PT5M}
  retry-backoff-cap: ${OUTBOX_RETRY_BACKOFF_CAP:PT30M}
  lock-at-most-for: ${OUTBOX_LOCK_AT_MOST_FOR:PT5M}

classification:
  poll-delay-ms: ${CLASSIFICATION_POLL_DELAY_MS:600000}          # 미분류 글 재분류 폴러 주기(기본 10분)
  poll-initial-delay-ms: ${CLASSIFICATION_POLL_INITIAL_DELAY_MS:600000}
  lock-at-most-for: ${CLASSIFICATION_LOCK_AT_MOST_FOR:PT9M}      # 폴러 인스턴스 락 상한(폴 주기보다 짧게)

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
    redis:
      enabled: false
  metrics:
    cache:
      enabled: true
    tags:
      application: uhsuhjupjup-backend
      instance_name: ${INSTANCE_NAME:local}
    distribution:
      slo:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s
      percentiles-histogram:
        http.server.requests: false

