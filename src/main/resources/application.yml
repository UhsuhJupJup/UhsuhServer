spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/uhsuhjupjup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: uhsuhjupjup
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

firebase:
  service-account-path: ${UHSUHJUPJUP_FIREBASE_CREDENTIALS_PATH}

claude:
  enabled: ${CLAUDE_ENABLED:false}
  model: ${CLAUDE_MODEL:claude-haiku-4-5}
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: uhsuhjupjup-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
