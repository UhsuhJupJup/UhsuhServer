services:
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: uhsuh-mysqld-exporter
    restart: unless-stopped
    command:
      - "--mysqld.address=uhsuh-mysql:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER}"
      - "--collect.info_schema.tables"
      - "--no-collect.slave_status"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    networks:
      - appnet

  prometheus-agent:
    image: prom/prometheus:latest
    container_name: uhsuh-prom-agent
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.cloud.yml"
      - "--agent"
      - "--storage.agent.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.cloud.yml:/etc/prometheus/prometheus.cloud.yml:ro
      - ./prometheus/gc_token:/etc/prometheus/gc_token:ro
      - prom_agent_wal:/prometheus
    networks:
      - appnet

networks:
  appnet:
    external: true
    name: ${UHSUH_NETWORK:-uhsuh_uhsuh}

volumes:
  prom_agent_wal:
