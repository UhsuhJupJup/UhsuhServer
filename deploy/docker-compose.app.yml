services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: uhsuh-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul

      DB_HOST: ${DATA_HOST}
      DB_PORT: "3306"
      DB_NAME: uhsuhjupjup
      DB_USERNAME: uhsuhjupjup
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${DATA_HOST}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MAIL_ENABLED: "true"
      MAIL_HOST: email-smtp.ap-northeast-2.amazonaws.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: "어서줍줍 <noreply@uhsuh.com>"
      MAIL_UNSUBSCRIBE_BASE_URL: https://api.uhsuh.com/api/unsubscribe

      CLAUDE_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      CORS_ALLOWED_ORIGINS: https://uhsuh.com,https://www.uhsuh.com

      UHSUHJUPJUP_FIREBASE_CREDENTIALS_PATH: /app/firebase.json

      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx384m"
    volumes:
      - /opt/uhsuh/firebase.json:/app/firebase.json:ro
    ports:
      - "8080:8080"
