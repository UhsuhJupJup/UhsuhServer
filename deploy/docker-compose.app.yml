services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: uhsuh-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul

      DB_HOST: ${DATA_HOST}
      DB_PORT: "3306"
      DB_NAME: uhsuhjupjup
      DB_USERNAME: uhsuhjupjup
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${DATA_HOST}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MAIL_ENABLED: "true"
      MAIL_HOST: email-smtp.ap-northeast-2.amazonaws.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: "어서줍줍 <noreply@uhsuh.com>"
      MAIL_UNSUBSCRIBE_BASE_URL: https://api.uhsuh.com/api/unsubscribe

      CLAUDE_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      CORS_ALLOWED_ORIGINS: https://uhsuh.com,https://www.uhsuh.com

      UHSUHJUPJUP_FIREBASE_CREDENTIALS_PATH: /app/firebase.json

      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx320m"

      INSTANCE_NAME: ${INSTANCE_NAME:-unknown}
    volumes:
      - /opt/uhsuh/firebase.json:/app/firebase.json:ro
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"
        max-buffer-size: "4m"

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: uhsuh-alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-unknown}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN}
    volumes:
      - ./alloy/config.app.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  alloy_data:
