services:
  mysql:
    image: mysql:8.0
    container_name: uhsuh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: uhsuhjupjup
      MYSQL_USER: uhsuhjupjup
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uhsuh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    container_name: uhsuh-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: uhsuhjupjup
      DB_USERNAME: uhsuhjupjup
      DB_PASSWORD: ${DB_PASSWORD}

      MAIL_ENABLED: "true"
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: "어서줍줍 <uhsuhjupjup@gmail.com>"
      MAIL_UNSUBSCRIBE_BASE_URL: https://api.uhsuh.com/api/unsubscribe

      CLAUDE_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      CORS_ALLOWED_ORIGINS: https://uhsuh.com,https://www.uhsuh.com

      UHSUHJUPJUP_FIREBASE_CREDENTIALS_PATH: /app/firebase.json
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    volumes:
      - /opt/uhsuh/firebase.json:/app/firebase.json:ro
    ports:
      - "8080:8080"
    networks:
      - uhsuh

networks:
  uhsuh:

volumes:
  mysql_data:
